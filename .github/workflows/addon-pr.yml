name: Add-on submission

# Every mechanical check an add-on submission has to pass, run on the pull
# request itself.
#
# Until this existed, `release.yml` was the only workflow here and it runs
# AFTER a tag — so every one of these checks was run by hand by a maintainer,
# from a private toolchain a contributor could neither see nor reproduce. The
# design and the measured basis for each layer are in issue #19, written from
# four review rounds across #3 and #4.
#
# What it is for is as much what it does NOT do. Every honesty defect that
# round — a button reporting a publish it never performed, a "Live" badge over
# demo data, an executor returning success for work it never did — came from a
# person reading the code against its own claims, and none of it is reachable
# by a linter. This exists so that a maintainer's attention is not spent on
# lockfiles and method names, and goes where only a person can go.

on:
  pull_request:
    paths:
      - "addons/**"

permissions:
  contents: read

concurrency:
  group: addon-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    steps:
      # Full history: the adjudicator applies the submission to the BASE and
      # the checks compare against it, and neither is possible from a depth-1
      # checkout.
      # `persist-credentials: false` because a later step runs the submission's
      # own build and test scripts. The default leaves GITHUB_TOKEN in
      # .git/config, which that code can read; nothing here needs it, since
      # `fetch-depth: 0` has already fetched everything and the only remote
      # operation afterwards is an anonymous clone of a public repository.
      - name: Checkout the pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      # The gate must not be modifiable by what it is gating. Stage 1 refuses a
      # patch that touches anything outside `addons/<id>/`, but that gate is
      # itself one of the files a patch could edit, so it cannot be the thing
      # that protects itself. Everything judging this submission is therefore
      # run from the BASE revision, never from the pull request's own tree.
      - name: Check out the base revision, which supplies the tooling
        run: |
          git worktree add --detach base "origin/${GITHUB_BASE_REF}"
          echo "Tooling from $(git -C base rev-parse --short HEAD)"

      - name: Identify the add-on under review
        id: addon
        run: |
          CHANGED=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD")
          echo "Changed files:"
          echo "$CHANGED" | sed 's/^/  /'
          IDS=$(echo "$CHANGED" | sed -n 's|^addons/\([^/]*\)/.*|\1|p' | sort -u)
          COUNT=$(echo "$IDS" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
            # Not this step's job to rule on it — stage 1 reports it properly,
            # with the paths — but the steps below need one add-on to act on.
            echo "::error::Expected exactly one addons/<id>/ in this pull request, found: ${IDS//$'\n'/, }"
            exit 1
          fi
          # Refuse anything that is not a plain id, HERE, before any later step
          # has it. Stage 3 gates the id properly against the manifest, but it
          # does so in a different file behind a different gate — and the shell
          # steps below would otherwise receive whatever `sed` cut out of a path.
          # git C-quotes only `"`, `\` and control bytes, so `$`, `(`, `)`, `|`,
          # `;` and spaces survive a path intact. Nothing exploitable reached
          # those steps while stage 3 held, which is exactly the kind of
          # protection that should not be load-bearing from another file.
          if ! printf '%s' "$IDS" | grep -Eq '^[a-z][a-z0-9-]{1,40}$'; then
            echo "::error::Add-on directory name \"$IDS\" is not of the form [a-z][a-z0-9-]{1,40}"
            exit 1
          fi
          echo "addon=$IDS" >> "$GITHUB_OUTPUT"
          echo "Add-on: $IDS"

      # The documented submission format: `git format-patch main..HEAD`. One
      # logical commit is a gate in its own right (CONTRIBUTING.md), so the
      # adjudicator reads the same thing a contributor is asked to produce,
      # sign-offs and all.
      - name: Produce the patch
        run: |
          git format-patch "origin/${GITHUB_BASE_REF}..HEAD" --stdout > "${RUNNER_TEMP}/pr.patch"
          # `--no-merges` matters here: on a `pull_request` event the checkout is
          # the synthetic MERGE commit, so a plain count returns 2 for a
          # one-commit submission and this error fired on every pull request.
          # `format-patch` already omits merges, so stage 0 was right and only
          # the advice was wrong — which is the worse way round, because it
          # taught contributors to distrust a correct gate.
          COMMITS=$(git rev-list --count --no-merges "origin/${GITHUB_BASE_REF}..HEAD")
          # Stage 0 blocks on this, correctly and by documented policy — but it
          # reports a count, and a count does not tell you what to do. Say it.
          if [ "$COMMITS" -ne 1 ]; then
            echo "::error::This branch has $COMMITS commits and a submission is one logical commit" \
              "(CONTRIBUTING.md). Squash and force-push:" \
              "git reset --soft \$(git merge-base origin/${GITHUB_BASE_REF} HEAD) && git commit -s && git push --force-with-lease"
          fi

      - name: Stages 0-5 — scope, provenance, manifest, supply chain
        run: |
          node base/scripts/adjudicate/adjudicate.mjs \
            --patch "${RUNNER_TEMP}/pr.patch" \
            --repo base

      # The id goes through `env:` rather than being interpolated into the
      # script. A `${{ }}` expression is substituted into the script text before
      # bash parses it, so a value carrying shell metacharacters would be
      # executed rather than passed; `$ADDON` is just a variable by then.
      - name: Add-on checks — licence, lockfile, API surface, manifest claims
        env:
          ADDON: ${{ steps.addon.outputs.addon }}
        run: |
          node base/scripts/adjudicate/checks.mjs \
            --addon "$ADDON" \
            --src . \
            --patch "${RUNNER_TEMP}/pr.patch" \
            --base-ref "origin/${GITHUB_BASE_REF}"

      # One add-on's test suite validates its manifest against the app's REAL
      # `validateManifest()` rather than against a copy of the rules. It is the
      # strongest test in either submission and the reason it is worth solving
      # the cross-repo dependency issue #19 left open, instead of letting the
      # suite skip in CI.
      #
      # The tag comes out of the surface artifact, so the version the static
      # checks judge against and the version the tests run against cannot drift
      # apart. One pin, two consumers.
      #
      # `semver` is installed in ISOLATION and then placed, which is not
      # fussiness: `npm install --no-save semver` inside the checkout reconciles
      # everything package.json declares too, and that is a gigabyte of Electron
      # toolchain to obtain one module with no dependencies of its own. This way
      # is 12 MB and seconds. `manifest.ts` imports nothing else.
      - name: Check out mosaic-companion at the pinned surface version
        id: companion
        run: |
          REF=$(node -p "require('./base/scripts/adjudicate/addon-surface.json').app.describe")
          WANT=$(node -p "require('./base/scripts/adjudicate/addon-surface.json').app.commit")
          echo "mosaic-companion $REF"
          git clone --quiet --depth 1 --branch "$REF" \
            https://github.com/hypercycle-development/mosaic-companion.git "${RUNNER_TEMP}/companion"
          # The surface artifact records the commit it was generated from, and
          # until now nothing compared it to what the tag actually resolves to.
          # A moved tag would silently judge submissions against one revision
          # while testing them against another.
          GOT=$(git -C "${RUNNER_TEMP}/companion" rev-parse HEAD)
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::addon-surface.json was generated at $WANT but tag $REF now resolves to $GOT"
            exit 1
          fi
          npm --prefix "${RUNNER_TEMP}/semver-only" install \
            --no-save --ignore-scripts --no-audit --no-fund semver
          mkdir -p "${RUNNER_TEMP}/companion/node_modules"
          cp -R "${RUNNER_TEMP}/semver-only/node_modules/." "${RUNNER_TEMP}/companion/node_modules/"
          echo "path=${RUNNER_TEMP}/companion" >> "$GITHUB_OUTPUT"

      # Exactly what the release build does — `npm ci --ignore-scripts` then the
      # add-on's own build — because a lockfile `npm ci` refuses, or a build
      # that does not compile, is only ever caught here. Both happened.
      # Written BEFORE the submission's own code runs. Every step from here on
      # executes contributor code, and `$GITHUB_STEP_SUMMARY` is writable from
      # it — so a submission can append whatever Markdown it likes to this job's
      # summary. It cannot alter what is already there, so stating the verdict
      # first means anything appended appears below it rather than instead of it.
      - name: Record the gate result before running submitted code
        env:
          ADDON: ${{ steps.addon.outputs.addon }}
        run: |
          {
            echo "## Add-on submission: \`$ADDON\`"
            echo
            echo "Stages 0–5 and the add-on checks **passed**, judged from the base revision."
            echo
            echo "Everything below this line is produced by the submission's own"
            echo "build and test scripts and is not a statement by this workflow."
            echo
            echo "---"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install and build the add-on, alone
        working-directory: addons/${{ steps.addon.outputs.addon }}
        run: |
          if [ ! -f package.json ]; then
            echo "No npm project in this add-on — nothing to install or build."
            exit 0
          fi
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          else
            # The `lockfile-present` gate already failed this submission, so the
            # job will not reach a merge. Said here only so the build log does
            # not read as though a missing lockfile were tolerable: publication
            # runs `npm ci`, which fails outright without one. The two halves of
            # this pull request disagreed about that until 2026-11-27.
            echo "::error::No lockfile. Publication runs \`npm ci\`, which fails without one — see the lockfile-present gate above."
            exit 1
          fi
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          else
            echo "No build script declared."
          fi

      # Required to pass WITH ONLY THAT ADD-ON PRESENT. That is the property
      # that broke this round: a suite that passed for its author depended on a
      # sibling add-on being checked out beside it, and a `npm test` that
      # printed a skip then exited 1 anyway.
      - name: Run the add-on's own tests
        working-directory: addons/${{ steps.addon.outputs.addon }}
        env:
          MOSAIC_COMPANION: ${{ steps.companion.outputs.path }}
        run: |
          if [ ! -f package.json ]; then exit 0; fi
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "::notice::No test script declared. Nothing to run — and nothing establishing that this add-on works."
          fi
